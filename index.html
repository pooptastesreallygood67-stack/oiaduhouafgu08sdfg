<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✦ Genshin Impact Wish Simulator v2.6 ✦</title>
    <style>
        body { 
            background: radial-gradient(circle at center, #161b29 0%, #080a10 100%); 
            color: #ecd1a8; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
        }
        .container { text-align: center; width: 90%; max-width: 800px; }
        .banner { background: rgba(26, 32, 48, 0.95); border: 2px solid #bda275; border-radius: 16px; padding: 35px; box-shadow: 0 15px 45px rgba(0,0,0,0.8); }
        button { 
            background: linear-gradient(180deg, #f3e1c3, #dfc599); 
            border: 1px solid #bda275; 
            padding: 14px 45px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 25px; 
            cursor: pointer; 
            margin: 10px 0 25px 0;
            color: #222;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        button:hover { transform: scale(1.03); background: #f3e1c3; }
        .display-window { 
            margin-top: 15px; 
            min-height: 460px; 
            background: #05070a; 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            border: 1px solid #232936;
            padding: 20px;
        }
        /* Graphic Window Grid container */
        .art-viewport {
            width: 260px;
            height: 260px;
            display: none;
            justify-content: center;
            align-items: center;
            animation: wishReveal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
        }
        @keyframes wishReveal {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .char-name { font-size: 30px; font-weight: bold; margin-top: 25px; display: none; letter-spacing: 2px; }
        .stars { font-size: 24px; color: #ffcc00; margin-top: 5px; display: none; letter-spacing: 3px; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="letter-spacing: 3px; font-weight: 300; text-transform: uppercase;">✦ Gacha Sandbox Network ✦</h2>
        <div class="banner">
            <h3 style="color: #fff; font-weight: 400; margin-top: 0; letter-spacing: 1px;">Current Banner: Reign of Serenity</h3>
            <button onclick="pull()">Single Wish</button>
            <div class="display-window">
                <div id="statusText" style="font-size: 18px; color: #5f6d85;">Awaiting dynamic alignment coordinates...</div>
                <div id="artBox" class="art-viewport"></div>
                <div id="nameDiv" class="char-name"></div>
                <div id="starDiv" class="stars">★★★★★</div>
            </div>
        </div>
    </div>

    <script>
        // Injecting direct vector math shapes so no blank background can happen
        const raidenVector = `<svg width="220" height="220" viewBox="0 0 100 100" xmlns="http://w3.org"><circle cx="50" cy="50" r="46" fill="#1d163a" stroke="#ca70ff" stroke-width="3"/><path d="M30 35c-5 10-3 35 5 45h30c8-10 10-35 5-45z" fill="#2d2154"/><path d="M50 15v55" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><path d="M50 20v40" stroke="#ca70ff" stroke-width="2.5" stroke-linecap="round"/><path d="M36 40l8 4M64 40l-8 4" stroke="#ffffff" stroke-width="2"/><circle cx="43" cy="45" r="2" fill="#fff"/><circle cx="57" cy="45" r="2" fill="#fff"/></svg>`;
        
        const zhongliVector = `<svg width="220" height="220" viewBox="0 0 100 100" xmlns="http://w3.org"><circle cx="50" cy="50" r="46" fill="#281e13" stroke="#ffaa00" stroke-width="3"/><path d="M28 45l22-15 22 15v30H28z" fill="#3c2d1c"/><path d="M50 10v75" stroke="#ffaa00" stroke-width="4" stroke-linecap="round"/><polygon points="50,10 44,22 56,22" fill="#ffffff"/><rect x="44" y="38" width="12" height="12" fill="none" stroke="#ffaa00" stroke-width="2.5" transform="rotate(45 50 44)"/></svg>`;

        const furinaVector = `<svg width="220" height="220" viewBox="0 0 100 100" xmlns="http://w3.org"><circle cx="50" cy="50" r="46" fill="#122236" stroke="#00ccff" stroke-width="3"/><path d="M35 38l5-18h20l5 18z" fill="#1c3352" stroke="#00ccff" stroke-width="2"/><circle cx="50" cy="25" r="4" fill="#00ccff"/><path d="M25 75l50-50" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><circle cx="35" cy="52" r="3.5" fill="none" stroke="#00ccff" stroke-width="1.5"/></svg>`;

        function pull() {
            document.getElementById("statusText").style.display = "block";
            document.getElementById("statusText").innerText = "💫 Rendering banner template graphics local-side...";
            document.getElementById("artBox").style.display = "none";
            document.getElementById("nameDiv").style.display = "none";
            document.getElementById("starDiv").style.display = "none";

            setTimeout(() => {
                document.getElementById("statusText").style.display = "none";
                let roll = Math.floor(Math.random() * 3);
                
                let artBox = document.getElementById("artBox");
                let nameEl = document.getElementById("nameDiv");

                if (roll === 0) {
                    artBox.innerHTML = raidenVector;
                    artBox.style.filter = "drop-shadow(0 0 25px #ca70ff)";
                    nameEl.innerText = "Raiden Shogun (⚡ Electro)";
                    nameEl.style.color = "#ca70ff";
                } else if (roll === 1) {
                    artBox.innerHTML = zhongliVector;
                    artBox.style.filter = "drop-shadow(0 0 25px #ffaa00)";
                    nameEl.innerText = "Zhongli (🪨 Geo)";
                    nameEl.style.color = "#ffaa00";
                } else {
                    artBox.innerHTML = furinaVector;
                    artBox.style.filter = "drop-shadow(0 0 25px #00ccff)";
                    nameEl.innerText = "Furina (💧 Hydro)";
                    nameEl.style.color = "#00ccff";
                }

                artBox.style.display = "flex";
                nameEl.style.display = "block";
                document.getElementById("starDiv").style.display = "block";
            }, 500);
        }
    </script>
</body>
</html>
