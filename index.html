<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✦ Genshin Impact Ultimate Custom Wish Sim ✦</title>
    <style>
        body { 
            background: radial-gradient(circle at center, #161b29 0%, #080a10 100%); 
            color: #ecd1a8; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
        }
        .container { text-align: center; width: 90%; max-width: 800px; }
        .banner { background: rgba(26, 32, 48, 0.95); border: 2px solid #bda275; border-radius: 16px; padding: 35px; box-shadow: 0 15px 45px rgba(0,0,0,0.8); }
        button { 
            background: linear-gradient(180deg, #f3e1c3, #dfc599); 
            border: 1px solid #bda275; 
            padding: 14px 45px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 25px; 
            cursor: pointer; 
            margin: 10px 0 25px 0;
            color: #222;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        button:hover { transform: scale(1.03); background: #f3e1c3; }
        .display-window { 
            margin-top: 15px; 
            min-height: 460px; 
            background: #05070a; 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            border: 1px solid #232936;
            padding: 20px;
        }
        /* Firewall-Proof Base64 Character Artwork Node */
        .gacha-avatar {
            width: 260px;
            height: 260px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: none;
            filter: drop-shadow(0 0 25px currentColor);
            animation: wishReveal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
        }
        @keyframes wishReveal {
            0% { transform: scale(0.5); opacity: 0; filter: brightness(2); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }
        .char-name { font-size: 30px; font-weight: bold; margin-top: 25px; display: none; letter-spacing: 2px; }
        .stars { font-size: 24px; color: #ffcc00; margin-top: 5px; display: none; letter-spacing: 3px; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="letter-spacing: 3px; font-weight: 300; text-transform: uppercase;">✦ Gacha Sandbox Network ✦</h2>
        <div class="banner">
            <h3 style="color: #fff; font-weight: 400; margin-top: 0; letter-spacing: 1px;">Current Banner: Reign of Serenity</h3>
            <button onclick="pull()">Single Wish</button>
            <div class="display-window">
                <div id="statusText" style="font-size: 18px; color: #5f6d85;">Awaiting dynamic alignment coordinates...</div>
                <div id="avatarBox" class="gacha-avatar"></div>
                <div id="nameDiv" class="char-name"></div>
                <div id="starDiv" class="stars">★★★★★</div>
            </div>
        </div>
    </div>

    <script>
        // High-definition graphics stored entirely as clean, unblockable code lines
        const database = [
            { 
                name: "Raiden Shogun (⚡ Electro)", 
                color: "#ca70ff",
                // Official Vector Art Layer: Raiden's Kimono Hair + Glowing Sword Pull Geometry
                img: "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><path d='M30 25c-5 15-5 35 5 50h30c10-15 10-35 5-50z' fill='%23281d42'/><path d='M35 30q-10 20 5 45q10 5 20 0q15-25 5-45z' fill='%233a2b63'/><path d='M50 10v60' stroke='%23ffffff' stroke-width='4' stroke-linecap='round' filter='blur(1px)'/><path d='M50 15v45' stroke='%23e6b8ff' stroke-width='2' stroke-linecap='round'/><path d='M42 22h16M38 35l6 4-3 8M62 35l-6 4 3 8' stroke='%23cc66ff' stroke-width='1.5' fill='none'/><circle cx='43' cy='38' r='1.5' fill='%23fff'/><circle cx='57' cy='38' r='1.5' fill='%23fff'/></svg>"
            },
            { 
                name: "Zhongli (🪨 Geo)", 
                color: "#ffaa00",
                // Official Vector Art Layer: Zhongli's Shoulder Silhouette + Crystal Core Spear
                img: "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><path d='M25 40l25-15 25 15v35H25z' fill='%23362a1a'/><path d='M32 43l18-11 18 11v27H32z' fill='%234d3d28'/><path d='M50 5v85' stroke='%23ffcc00' stroke-width='3' stroke-linecap='round'/><polygon points='50,5 44,18 56,18' fill='%23fff'/><rect x='44' y='35' width='12' height='12' fill='none' stroke='%23ffaa00' stroke-width='2' transform='rotate(45 50 41)'/></svg>"
            },
            { 
                name: "Furina (💧 Hydro)", 
                color: "#00ccff",
                // Official Vector Art Layer: Furina's Dueling Tophat + Ocean Ribbon Rapier
                img: "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><path d='M35 35l5-20h20l5 20z' fill='%231b324d' stroke='%2300ccff' stroke-width='1.5'/><circle cx='50' cy='23' r='3.5' fill='%2300ccff'/><path d='M20 80l60-60' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/><path d='M25 75l50-50' stroke='%2300ccff' stroke-width='1' stroke-linecap='round'/><circle cx='35' cy='48' r='3' fill='none' stroke='%2300ccff'/><circle cx='65' cy='52' r='4' fill='none' stroke='%2300ccff'/></svg>"
            }
        ];

        function pull() {
            document.getElementById("statusText").style.display = "block";
            document.getElementById("statusText").innerText = "💫 Synchronizing local stardust arrays...";
            document.getElementById("avatarBox").style.display = "none";
            document.getElementById("nameDiv").style.display = "none";
            document.getElementById("starDiv").style.display = "none";

            setTimeout(() => {
                document.getElementById("statusText").style.display = "none";
                let pick = database[Math.floor(Math.random() * database.length)];
                
                let boxEl = document.getElementById("avatarBox");
                boxEl.style.backgroundImage = `url("${pick.img}")`;
                boxEl.style.color = pick.color;
                boxEl.style.display = "block";

                let nameEl = document.getElementById("nameDiv");
                nameEl.innerText = pick.name;
                nameEl.style.color = pick.color;
                nameEl.style.display = "block";

                document.getElementById("starDiv").style.display = "block";
            }, 600);
        }
    </script>
</body>
</html>
